name: Ошибка
description: Сообщить об ошибке установки, подключения или получения данных
body:
  - type: markdown
    attributes:
      value: |
        Не прикладывайте пароли, коды, cookie, токены, полные SSO-ссылки и персональные данные.
        Для сообщений об уязвимостях используйте SECURITY.md.
  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: ОС, версия Python, MCP-клиента и mirea-connect; локальный или удалённый режим.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Команда или обезличенный запрос ассистенту и последовательность действий.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
      description: Текст ошибки без секретов и персональных данных.
    validations:
      required: true
